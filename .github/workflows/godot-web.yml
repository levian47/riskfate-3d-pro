name: Godot Web / GitHub Pages

on:
  push:
    branches: [main, feature/web-pr-preview-pages]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Зібрати Android APK вручну (тільки за прямою командою власника)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  # Latest main commit supersedes a stale or stuck Web build.
  cancel-in-progress: true

jobs:
  # PR events never deploy Pages directly. Ask the trusted main workflow to
  # rebuild production and previews together when an opted-in PR changes.
  refresh_preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, 'riskfate:web-preview')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Request main Pages preview refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Godot Web / GitHub Pages" --ref main

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          version="4.7.2"
          # Official Godot download endpoint (not GitHub release CDN):
          # avoids intermittent 504s on GitHub asset downloads.
          base="https://downloads.godotengine.org/?version=${version}&flavor=stable"
          curl -fL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/godot.zip" "${base}&platform=linux.64&slug=linux.x86_64.zip"
          curl -fL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/templates.tpz" "${base}&platform=templates&slug=export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          godot_bin="$RUNNER_TEMP/godot-bin/Godot_v${version}-stable_linux.x86_64"
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-export"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv "$RUNNER_TEMP/godot-export/templates" "$HOME/.local/share/godot/export_templates/${version}.stable"
          "$godot_bin" --headless --version

      - name: Import project assets
        run: |
          "$GODOT_BIN" --headless --path . --editor --quit

      - name: Smoke-test animation and world initialization
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/gameplay_smoke.gd

      - name: Smoke-test new VRoid player and animations
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/vroid_hero_smoke.gd

      - name: Export Web build
        run: |
          mkdir -p dist
          "$GODOT_BIN" --headless --path . --export-release Web "$PWD/dist/index.html"
          test -s dist/index.html
          test -s dist/index.js
          test -s dist/index.wasm
          test -s dist/index.pck
          echo "Web export resource pack (PCK): $(stat -c %s dist/index.pck) bytes"
          # Exported HTML, JS, WASM and PCK files share the fixed "index" name.
          # Put each complete export under its own revision URL to prevent
          # browsers from mixing a new page with an older cached game pack.
          revision="${GITHUB_SHA:0:12}"
          mkdir -p "dist/builds/$revision"
          mv dist/index.* "dist/builds/$revision/"
          cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="uk">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=builds/$revision/">
            <title>Riskfate 3D Pro</title>
          </head>
          <body><a href="builds/$revision/">Відкрити Riskfate 3D Pro</a></body>
          </html>
          EOF
          test -s "dist/builds/$revision/index.html"
          test -s "dist/builds/$revision/index.js"
          test -s "dist/builds/$revision/index.wasm"
          test -s "dist/builds/$revision/index.pck"
          test -s dist/index.html
          touch dist/.nojekyll

      - name: Verify exported pack without project sources
        run: |
          # Test the actual packed resources, not the original repository.
          cd "$RUNNER_TEMP"
          "$GODOT_BIN" --headless --main-pack "$GITHUB_WORKSPACE/dist/builds/${GITHUB_SHA:0:12}/index.pck" --script res://tests/gameplay_smoke.gd

      # Opt-in only: a same-repository PR includes the marker below in its body.
      # The main game and previews are deployed together, preserving the home page.
      - name: Build opted-in Web PR previews (no Android)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=50" \
            | jq -r --arg repo "${GITHUB_REPOSITORY}" '
              .[] | select(.head.repo.full_name == $repo)
                  | select((.body // "") | contains("riskfate:web-preview"))
                  | [.number, .head.sha] | join(" ")
            ' | sed -n '1,2p' > "$RUNNER_TEMP/riskfate-web-previews.txt"

          while read -r pr sha; do
            [[ "$pr" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git fetch --no-tags --depth=1 origin "refs/pull/${pr}/head"
            [[ "$(git rev-parse FETCH_HEAD)" == "$sha" ]] || {
              echo "PR $pr changed during checkout; retry workflow" >&2
              exit 1
            }
            source="$RUNNER_TEMP/riskfate-preview-$pr"
            git worktree add --detach "$source" FETCH_HEAD
            "$GODOT_BIN" --headless --path "$source" --editor --quit
            "$GODOT_BIN" --headless --path "$source" --script res://tests/gameplay_smoke.gd
            "$GODOT_BIN" --headless --path "$source" --script res://tests/vroid_hero_smoke.gd

            base="$GITHUB_WORKSPACE/dist/previews/pr-$pr"
            revision="${sha:0:12}"
            mkdir -p "$base/builds/$revision"
            "$GODOT_BIN" --headless --path "$source" --export-release Web "$base/builds/$revision/index.html"
            for ext in html js wasm pck; do
              test -s "$base/builds/$revision/index.$ext"
            done
            (
              cd "$RUNNER_TEMP"
              "$GODOT_BIN" --headless --main-pack "$base/builds/$revision/index.pck" --script res://tests/gameplay_smoke.gd
            )
            cat > "$base/index.html" <<EOF
          <!doctype html>
          <html lang="uk">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=builds/$revision/">
            <title>Riskfate 3D Pro — PR #$pr preview</title>
          </head>
          <body><a href="builds/$revision/">Відкрити Web-preview PR #$pr</a></body>
          </html>
          EOF
            echo "Preview PR #$pr: https://levian47.github.io/riskfate-3d-pro/previews/pr-$pr/"
          done < "$RUNNER_TEMP/riskfate-web-previews.txt"

      - name: Set up Java 17 for native Android export
        if: github.event_name == 'workflow_dispatch' && inputs.build_android == true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        if: github.event_name == 'workflow_dispatch' && inputs.build_android == true
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.1 platforms;android-35'

      - name: Prepare Android SDK and temporary test signing key
        if: github.event_name == 'workflow_dispatch' && inputs.build_android == true
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          # This is a temporary debug key only; never use it to sign release APKs.
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/riskfate-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Riskfate Test,O=Riskfate,C=UA'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/riskfate-debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Export and verify both signed Android benchmark APKs
        if: github.event_name == 'workflow_dispatch' && inputs.build_android == true
        shell: bash
        run: |
          set -euo pipefail
          revision="${GITHUB_SHA:0:12}"
          dir="$PWD/dist/builds/$revision"
          "$GODOT_BIN" --headless --path . --export-debug "Android Test" "$dir/riskfate-optimized.apk"
          "$GODOT_BIN" --headless --path . --export-debug "Android Classic" "$dir/riskfate-classic.apk"
          for apk in "$dir/riskfate-optimized.apk" "$dir/riskfate-classic.apk"; do
            test -s "$apk"
            unzip -tq "$apk"
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$apk" | head -n 2
            echo "Verified Android APK: $(basename "$apk") ($(stat -c %s "$apk") bytes)"
          done
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$dir/riskfate-optimized.apk" | grep -q "com.levian47.riskfate3dprobenchopt"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$dir/riskfate-classic.apk" | grep -q "com.levian47.riskfate3dprobenchclassic"

      - name: Upload standalone Android comparison APKs
        if: github.event_name == 'workflow_dispatch' && inputs.build_android == true
        uses: actions/upload-artifact@v4
        with:
          name: Riskfate-Android-Compare-Optimized-Classic
          path: dist/builds/*/riskfate-*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
